<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glicemia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glicemia">
<style>
:root{--bg:#f3f5f7;--c:#fff;--t:#1c1c1e;--m:#6b7280;--p:#0f766e;--r:#dc2626;--y:#d97706;--g:#16a34a;--l:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--c:#1a2128;--t:#e8eaed;--m:#9aa4af;--l:#2a333c}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
header h1{margin:0;font-size:1.2rem}header span{font-size:.85rem;opacity:.9}
main{max-width:640px;margin:auto;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;min-width:56px;border:0;background:none;color:var(--m);padding:8px 4px;font-size:.65rem}
nav button.on{color:var(--p);font-weight:700}nav i{display:block;font-style:normal;font-size:1.2rem}
.card{background:var(--c);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
label{display:block;font-size:.8rem;color:var(--m);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;font-size:1rem;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t)}
.row{display:flex;gap:10px}.row label{flex:1}
.b{width:100%;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:1rem;font-weight:600;margin-top:6px}
.b.s{background:var(--l);color:var(--t)}.b.d{background:var(--r)}
.al{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:.9rem;line-height:1.4}
.al.r{background:#fee2e2;color:#991b1b}.al.y{background:#fef3c7;color:#92400e}.al.g{background:#dcfce7;color:#166534}
.it{display:flex;align-items:center;gap:8px;background:var(--c);border-radius:10px;padding:10px;margin-bottom:8px;font-size:.85rem}.it>div:first-child{flex:1}
.vals{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pill{padding:1px 8px;border-radius:99px;color:#fff;font-weight:700}.pill.r{background:var(--r)}.pill.y{background:var(--y)}.pill.g{background:var(--g)}
.x{border:0;background:none;color:var(--m);font-size:1rem}
.mut{color:var(--m);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.grid b{display:block;font-size:1.3rem}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0 4px}.bar i{display:block}
.bar .r{background:var(--r)}.bar .g{background:var(--g)}.bar .y{background:var(--y)}
.leg{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600}
.leg .r{color:var(--r)}.leg .g{color:var(--g)}.leg .y{color:var(--y)}
.big{font-size:2.6rem;font-weight:800;text-align:center;color:var(--p)}
table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{padding:5px 4px;border-bottom:1px solid var(--l);text-align:left}
svg text{fill:var(--m);font-size:9px}
.dias{display:flex;gap:4px;margin-bottom:8px}.dias label{flex:1;text-align:center;margin:0;font-size:.7rem}.dias input{width:18px;height:18px;margin:4px auto 0}
#bn{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:9;background:var(--c);color:var(--t);border:2px solid var(--p);border-radius:12px;padding:12px;box-shadow:0 6px 20px #0007}
#bn .ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-weight:600}
#bn .ln button{border:0;background:var(--p);color:#fff;border-radius:8px;padding:6px 10px}
.pill.o{background:var(--m)}
.msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.92rem;line-height:1.45;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--p);color:#fff}.m.a{align-self:flex-start;background:var(--c);box-shadow:0 1px 3px #0002}.m.e{align-self:flex-start;background:#fee2e2;color:#991b1b}
.ia{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);display:flex;gap:8px;background:var(--bg);padding:8px 0}
.ia textarea{flex:1;margin:0;resize:none;height:46px;font:inherit;padding:10px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t)}
.ia .b{width:auto;margin:0;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:99px;padding:7px 11px;font-size:.8rem}
.off nav{display:none}
.ck{display:flex;gap:8px;align-items:flex-start;color:var(--t);font-size:.85rem}.ck input{width:20px;height:20px;margin:2px 0 0;flex:none}.ck a{color:var(--p)}
@media print{header,nav,.no{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #ccc}}
</style></head>
<body>
<header><h1>Glicemia</h1><span id="ult"></span></header>
<main id="app"></main>
<div id="bn" hidden><div id="bl"></div><button class="b" onclick="fecha()">Ok</button></div>
<nav>
<button data-t="reg" onclick="setTab('reg')"><i>✚</i>Registrar</button>
<button data-t="calc" onclick="setTab('calc')"><i>🧮</i>Calcular</button>
<button data-t="ia" onclick="setTab('ia')"><i>💬</i>Assistente</button>
<button data-t="lem" onclick="setTab('lem')"><i>⏰</i>Lembretes</button>
<button data-t="gra" onclick="setTab('gra')"><i>📈</i>Gráficos</button>
<button data-t="rel" onclick="setTab('rel')"><i>📄</i>Relatório</button>
<button data-t="aj" onclick="setTab('aj')"><i>⚙️</i>Ajustes</button>
</nav>
<script>
const $=s=>document.querySelector(s),K='glicemia_v1';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{regs:[]};D.regs=D.regs||[];D.rem=D.rem||[];D.del=D.del||[];D.regs.forEach(r=>{r.u=r.u||r.id});D.cu=D.cu||((D.cfg||{}).icr?Date.now():0);D.ru=D.ru||(D.rem.length?Date.now():0);D.cfg={passo:1,dur:4,baixo:70,alto:180,...D.cfg};if(D.cfg.calcOn===undefined)D.cfg.calcOn=!!D.cfg.icr;
const salva=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Não foi possível salvar neste navegador.')}},save=()=>{salva();agenda()};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const pad=n=>String(n).padStart(2,'0'),r2=x=>Math.round(x*100)/100;
const loc=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const fday=t=>new Date(t).toLocaleDateString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cor=g=>g<D.cfg.baixo?'r':g>D.cfg.alto?'y':'g';
const CX=['Café da manhã','Pós-café','Almoço','Pós-almoço','Jantar','Antes de dormir','Outros'];
let tab='reg',per=14,msg='',pre=null,lc=null;

function aviso(g){
 const c=D.cfg;if(g==null)return'';
 if(g<54)return'<div class="al r"><b>Hipoglicemia grave (abaixo de 54).</b> Trate agora: 15 g de carboidrato de ação rápida e meça de novo em 15 min. Se estiver confuso ou sem conseguir engolir, peça ajuda e ligue 192.</div>';
 if(g<c.baixo)return'<div class="al r"><b>Hipoglicemia (abaixo de '+c.baixo+').</b> Ingira 15 g de carboidrato de ação rápida, meça de novo em 15 min e repita se continuar baixa.</div>';
 if(g>250)return'<div class="al y"><b>Glicemia acima de 250.</b> Siga a orientação da sua equipe: verifique cetonas e hidrate-se. Procure atendimento se houver náusea, vômito, dor abdominal ou respiração acelerada.</div>';
 return''}
function IOB(now){const d=D.cfg.dur||4;return D.regs.reduce((a,r)=>{if(r.tp!=='basal'&&r.i>0){const h=(now-r.t)/36e5;if(h>=0&&h<d)a+=r.i*(1-h/d)}return a},0)}
const sel=days=>{const l=Date.now()-days*864e5;return D.regs.filter(r=>r.t>=l).sort((a,b)=>a.t-b.t)};
function stats(rs){
 const gs=rs.map(r=>r.g).filter(x=>x!=null),n=gs.length;if(!n)return null;
 const m=gs.reduce((a,b)=>a+b,0)/n,sd=Math.sqrt(gs.reduce((a,b)=>a+(b-m)**2,0)/n);
 const lo=gs.filter(x=>x<D.cfg.baixo).length,hi=gs.filter(x=>x>D.cfg.alto).length;
 return{n,m,sd,cv:sd/m*100,min:Math.min(...gs),max:Math.max(...gs),lo:lo/n*100,hi:hi/n*100,ok:(n-lo-hi)/n*100,nlo:lo,ng:gs.filter(x=>x<54).length}}
const bar=s=>'<div class="bar"><i class="r" style="width:'+s.lo+'%"></i><i class="g" style="width:'+s.ok+'%"></i><i class="y" style="width:'+s.hi+'%"></i></div><div class="leg"><span class="r">Baixo '+s.lo.toFixed(0)+'%</span><span class="g">No alvo '+s.ok.toFixed(0)+'%</span><span class="y">Alto '+s.hi.toFixed(0)+'%</span></div>';
const perSel=()=>'<div class="card no"><label>Período<select onchange="per=+this.value;render()">'+[7,14,30,90].map(d=>'<option value="'+d+'"'+(d===per?' selected':'')+'>'+d+' dias</option>').join('')+'</select></label></div>';

/* ---------- Registrar ---------- */
function vReg(){
 const p=pre||{};pre=null;
 return msg+'<div class="card"><label>Data e hora<input id="t" type="datetime-local" value="'+loc(Date.now())+'"></label>'+
 '<div class="row"><label>Glicemia (mg/dL)<input id="g" inputmode="decimal" value="'+(p.g??'')+'"></label><label>Carboidratos (g)<input id="c" inputmode="decimal" value="'+(p.c??'')+'"></label></div>'+
 '<div class="row"><label>Insulina rápida (U)<input id="i" inputmode="decimal" value="'+(p.i??'')+'"></label><label>Insulina basal (U)<input id="b" inputmode="decimal"></label></div>'+
 '<label>Contexto<select id="cx"><option value=""></option>'+CX.map(x=>'<option>'+x+'</option>').join('')+'</select></label>'+
 '<label>Observação<input id="n"></label><button class="b" onclick="addReg()">Salvar registro</button></div>'+lista()}
function lista(){
 const rs=[...D.regs].sort((a,b)=>b.t-a.t).slice(0,15);
 if(!rs.length)return'<p class="mut">Nenhum registro ainda.</p>';
 return'<h3>Últimos registros</h3>'+rs.map(r=>'<div class="it"><div><b>'+fmt(r.t)+'</b><br><span class="mut">'+[r.cx,r.n].filter(Boolean).map(esc).join(' · ')+'</span></div><div class="vals">'+
 (r.g!=null?'<span class="pill '+cor(r.g)+'">'+r.g+'</span>':'')+(r.c!=null?'<span>'+r.c+' g</span>':'')+(r.i!=null?'<span>'+r.i+' U '+(r.tp==='basal'?'basal':'rápida')+'</span>':'')+
 '</div><button class="x" onclick="del('+r.id+')">✕</button></div>').join('')}
function addReg(){
 const pos=v=>v>0?v:null,g=num($('#g').value),c=num($('#c').value),i=pos(num($('#i').value)),b=pos(num($('#b').value)),t=new Date($('#t').value).getTime();
 if(isNaN(t))return alert('Informe data e hora.');
 if(g==null&&c==null&&i==null&&b==null)return alert('Preencha ao menos um valor.');
 if(g!=null&&(g<20||g>600))return alert('Confira a glicemia: valor fora do esperado (20 a 600).');
 if(i!=null&&D.cfg.max&&i>D.cfg.max&&!confirm('Dose de insulina rápida acima do máximo definido ('+D.cfg.max+' U). Registrar mesmo assim?'))return;
 if(b!=null&&b>100)return alert('Confira a dose de insulina basal: valor fora do esperado.');
 const id=Date.now()+Math.floor(Math.random()*1e3),u=Date.now(),cx=$('#cx').value,n=$('#n').value.trim();
 if(g!=null||c!=null||i!=null)D.regs.push({id,t,g,c,i,tp:'rapida',cx,n,u});
 if(b!=null)D.regs.push({id:id+1,t,g:null,c:null,i:b,tp:'basal',cx,n,u});
 save();msg=aviso(g)+'<div class="al g">Registro salvo.</div>';render()}
function del(id){if(confirm('Apagar este registro?')){D.regs=D.regs.filter(r=>r.id!==id);D.del.push({id,u:Date.now()});save();render()}}

/* ---------- Calcular ---------- */
function vCalc(){return'<div class="card"><div class="row"><label>Glicemia atual (mg/dL)<input id="cg" inputmode="decimal" oninput="calc()"></label><label>Carboidratos (g)<input id="cc" inputmode="decimal" oninput="calc()"></label></div></div><div id="out"></div><p class="mut">Sugestão calculada apenas com os parâmetros dos Ajustes. Confirme sempre antes de aplicar e siga a orientação da sua equipe de saúde.</p>'}
function calc(){
 const c=D.cfg,g=num($('#cg').value),cb=num($('#cc').value)||0,o=$('#out');
 if(!c.calcOn){o.innerHTML='<div class="al y">A calculadora está desativada. Para ativar, vá em Ajustes, preencha os parâmetros definidos pela sua equipe de saúde e confirme o aviso.</div>';return}
 if(!(c.icr>0&&c.isf>0&&c.alvo>0&&c.max>0)){o.innerHTML='<div class="al y">Antes de usar, preencha em Ajustes os valores definidos pela sua endocrinologista: relação insulina/carboidrato, fator de sensibilidade, glicemia alvo e dose máxima.</div>';return}
 if(g==null){o.innerHTML='';return}
 if(g<c.baixo){o.innerHTML=aviso(g)+'<div class="al y">Dose não calculada: glicemia baixa. Trate primeiro e meça de novo.</div>';return}
 const iob=IOB(Date.now()),ref=cb/c.icr,corB=g>c.alvo?(g-c.alvo)/c.isf:0,corr=Math.max(0,corB-iob),total=ref+corr,passo=c.passo||1;
 let dose=Math.round(total/passo)*passo,cap=false;
 if(dose>c.max){dose=c.max;cap=true}
 lc={g,cb,dose};
 o.innerHTML=(g>250?aviso(g):'')+(cap?'<div class="al y">Dose limitada ao máximo definido ('+c.max+' U).</div>':'')+
 '<div class="card"><div class="mut" style="text-align:center">Dose sugerida</div><div class="big">'+r2(dose)+' U</div><table>'+
 '<tr><td>Refeição ('+cb+' g ÷ '+c.icr+')</td><td>'+r2(ref)+' U</td></tr>'+
 '<tr><td>Correção ('+g+' → '+c.alvo+')</td><td>'+r2(corB)+' U</td></tr>'+
 '<tr><td>Insulina ativa ('+r2(iob)+' U), descontada da correção</td><td>−'+r2(Math.min(iob,corB))+' U</td></tr>'+
 '<tr><td>Total antes de arredondar</td><td>'+r2(total)+' U</td></tr></table>'+
 '<button class="b" onclick="usar()">Usar no registro</button></div>'}
function usar(){pre={g:lc.g,c:lc.cb||null,i:lc.dose};setTab('reg')}

/* ---------- Gráficos ---------- */
function chart(rs,days){
 const pts=rs.filter(r=>r.g!=null);if(!pts.length)return'';
 const W=340,H=200,L=28,R=6,T=8,B=18,c=D.cfg,t1=Date.now(),t0=t1-days*864e5,y0=40,ym=Math.max(300,Math.ceil(Math.max(...pts.map(r=>r.g))/50)*50);
 const X=t=>L+(t-t0)/(t1-t0)*(W-L-R),Y=g=>T+(1-(Math.max(y0,g)-y0)/(ym-y0))*(H-T-B);
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><rect x="'+L+'" y="'+Y(c.alto)+'" width="'+(W-L-R)+'" height="'+(Y(c.baixo)-Y(c.alto))+'" fill="#16a34a" opacity=".15"/>';
 s+=[c.baixo,c.alto].map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#9ca3af" stroke-dasharray="3 3" stroke-width=".6"/><text x="2" y="'+(Y(v)+3)+'">'+v+'</text>').join('');
 s+='<polyline fill="none" stroke="#0f766e" stroke-width="1.2" opacity=".5" points="'+pts.map(r=>X(r.t)+','+Y(r.g)).join(' ')+'"/>';
 s+=pts.map(r=>'<circle cx="'+X(r.t)+'" cy="'+Y(r.g)+'" r="3" fill="'+(r.g<c.baixo?'#dc2626':r.g>c.alto?'#d97706':'#16a34a')+'"/>').join('');
 s+='<text x="'+L+'" y="'+(H-4)+'">'+new Date(t0).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+'</text><text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">hoje</text></svg>';
 return s}
function vGra(){
 const rs=sel(per),s=stats(rs);
 if(!s)return perSel()+'<p class="mut">Sem medições no período.</p>';
 return perSel()+'<div class="card">'+chart(rs,per)+'</div><div class="card"><div class="grid"><div><b>'+s.m.toFixed(0)+'</b><span class="mut">média</span></div><div><b>'+s.cv.toFixed(0)+'%</b><span class="mut">variação (CV)</span></div><div><b>'+s.n+'</b><span class="mut">medições</span></div></div>'+bar(s)+'<p class="mut">Os percentuais usam as medições registradas (furo no dedo), não o tempo contínuo.</p></div>'}

/* ---------- Relatório ---------- */
function vRel(){
 const rs=sel(per),s=stats(rs),c=D.cfg;
 const dias=new Set(rs.map(r=>fday(r.t))).size||1;
 const soma=tp=>rs.filter(r=>r.i!=null&&(tp==='basal'?r.tp==='basal':r.tp!=='basal')).reduce((a,r)=>a+r.i,0);
 const carb=rs.reduce((a,r)=>a+(r.c||0),0);
 const cxs=[...CX,...new Set(rs.map(r=>r.cx).filter(x=>x&&!CX.includes(x)))].map(x=>{const g=rs.filter(r=>r.cx===x&&r.g!=null).map(r=>r.g);return g.length?'<tr><td>'+x+'</td><td>'+g.length+'</td><td>'+(g.reduce((a,b)=>a+b,0)/g.length).toFixed(0)+'</td></tr>':''}).join('');
 let h=perSel()+'<div class="card"><h3 style="margin-top:0">Relatório de glicemia</h3><p class="mut">'+fday(Date.now()-per*864e5)+' a '+fday(Date.now())+' · '+per+' dias</p>';
 if(!s)return h+'<p class="mut">Sem medições no período.</p></div>';
 h+='<div class="grid"><div><b>'+s.m.toFixed(0)+'</b><span class="mut">média mg/dL</span></div><div><b>'+s.sd.toFixed(0)+'</b><span class="mut">desvio padrão</span></div><div><b>'+s.min+'–'+s.max+'</b><span class="mut">mín–máx</span></div></div>'+bar(s)+
 '<table style="margin-top:12px"><tr><td>Medições (média por dia)</td><td>'+s.n+' ('+(s.n/dias).toFixed(1)+')</td></tr><tr><td>Hipoglicemias (&lt;'+c.baixo+') / graves (&lt;54)</td><td>'+s.nlo+' / '+s.ng+'</td></tr>'+
 '<tr><td>Insulina rápida por dia (média)</td><td>'+r2(soma('rapida')/dias)+' U</td></tr><tr><td>Insulina basal por dia (média)</td><td>'+r2(soma('basal')/dias)+' U</td></tr><tr><td>Carboidratos por dia (média)</td><td>'+Math.round(carb/dias)+' g</td></tr>'+
 (c.icr?'<tr><td>Parâmetros em uso</td><td>RIC 1:'+c.icr+' · FS '+c.isf+' · alvo '+c.alvo+'</td></tr>':'')+'</table>';
 if(cxs)h+='<h4>Por contexto</h4><table><tr><th>Contexto</th><th>Nº</th><th>Média</th></tr>'+cxs+'</table>';
 h+='<h4>Registros</h4><table><tr><th>Data</th><th>Gli</th><th>Carb</th><th>Insulina</th><th>Contexto</th></tr>'+
 rs.map(r=>'<tr><td>'+fmt(r.t)+'</td><td>'+(r.g??'')+'</td><td>'+(r.c??'')+'</td><td>'+(r.i!=null?r.i+(r.tp==='basal'?' B':' R'):'')+'</td><td>'+esc(r.cx)+(r.n?' · '+esc(r.n):'')+'</td></tr>').join('')+'</table>'+
 '<button class="b no" onclick="print()">Imprimir ou salvar em PDF</button></div>';
 return h}

/* ---------- Ajustes ---------- */
function vAj(){
 const c=D.cfg,f=(id,l,v,ph)=>'<label>'+l+'<input id="'+id+'" inputmode="decimal" value="'+(v??'')+'" placeholder="'+(ph||'')+'"></label>';
 return msg+'<div class="card"><h3 style="margin-top:0">Parâmetros</h3><p class="mut">Use os valores definidos pela sua endocrinologista. O app não calcula nem altera esses números.</p>'+
